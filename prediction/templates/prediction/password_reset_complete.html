{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Changed - Smart Energy Analytics</title>

    <link rel="stylesheet"
          href="{% static 'css/smart_energy.css' %}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(5, 20, 35, 0.35),
                    rgba(5, 20, 35, 0.35)
                ),
                url("https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=2400&q=90");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .reset-container {
            width: 430px;
            max-width: 90%;

            padding: 38px 35px;

            background: rgba(7, 18, 30, 0.72);

            border: 1px solid rgba(125, 211, 252, 0.35);

            border-radius: 20px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(14, 165, 164, 0.12);

            backdrop-filter: blur(18px);

            color: white;

            text-align: center;
        }

        .reset-logo {
            font-size: 29px;
            font-weight: 700;
        }

        .reset-subtitle {
            color: #7dd3fc;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 1.5px;
            text-transform: uppercase;

            margin-top: 5px;
            margin-bottom: 28px;
        }

        .success-icon {
            font-size: 52px;
            margin-bottom: 10px;
        }

        .reset-container h2 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .reset-description {
            color: #cbd9e3;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 25px;
        }

        .success-box {
            padding: 14px;

            border-radius: 10px;

            background: rgba(14, 165, 164, 0.12);

            border: 1px solid rgba(125, 211, 252, 0.25);

            color: #dcebf3;

            font-size: 13px;

            line-height: 1.6;
        }

        .login-button {
            display: inline-block;

            margin-top: 25px;

            padding: 13px 25px;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0ea5a4,
                #1687c9
            );

            color: white;

            font-size: 14px;
            font-weight: 700;

            text-decoration: none;

            transition: all 0.25s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(14, 165, 164, 0.30);
        }

    </style>

</head>

<body>

<div class="reset-container">

    <div class="reset-logo">
        ⚡ Smart Energy
    </div>

    <div class="reset-subtitle">
        Password Recovery
    </div>

    <div class="success-icon">
        ✅
    </div>

    <h2>
        Password Changed Successfully
    </h2>

    <p class="reset-description">
        Your Smart Energy Analytics password has
        been successfully updated.
    </p>

    <div class="success-box">
        Your account is now ready to use.
        Please login with your new password.
    </div>

    <a
        href="{% url 'login' %}"
        class="login-button"
    >
        ⚡ Login to Your Account
    </a>

</div>

</body>

</html>
