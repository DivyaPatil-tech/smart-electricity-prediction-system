{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Smart Energy Analytics</title>

    <link rel="stylesheet"
          href="{% static 'css/smart_energy.css' %}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    rgba(5, 20, 35, 0.35),
                    rgba(5, 20, 35, 0.35)
                ),
                url("https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&w=2400&q=90");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .reset-container {
            width: 430px;
            max-width: 90%;

            padding: 35px;

            background: rgba(7, 18, 30, 0.72);

            border: 1px solid rgba(125, 211, 252, 0.35);

            border-radius: 20px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(14, 165, 164, 0.12);

            backdrop-filter: blur(18px);

            color: white;

            text-align: center;
        }

        .reset-logo {
            font-size: 29px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .reset-subtitle {
            color: #7dd3fc;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .reset-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .reset-container h2 {
            margin-bottom: 10px;
            font-size: 27px;
        }

        .reset-description {
            color: #cbd9e3;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .reset-container label {
            display: block;
            text-align: left;

            margin-bottom: 8px;

            color: #e8f4fa;

            font-size: 13px;
            font-weight: 600;
        }

        .reset-container input[type="email"] {
            width: 100%;
            box-sizing: border-box;

            padding: 13px 14px;

            border: 1px solid rgba(125, 211, 252, 0.25);

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.95);

            color: #17212b;

            font-size: 14px;

            outline: none;

            margin-bottom: 20px;
        }

        .reset-container input[type="email"]:focus {
            border-color: #0ea5a4;

            box-shadow:
                0 0 0 3px rgba(14, 165, 164, 0.15);
        }

        .reset-button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #0ea5a4,
                #1687c9
            );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        .reset-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(14, 165, 164, 0.32);
        }

        .back-login {
            margin-top: 22px;
        }

        .back-login a {
            color: #7dd3fc;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-login a:hover {
            color: #5eead4;
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="reset-container">

    <div class="reset-logo">
        ⚡ Smart Energy
    </div>

    <div class="reset-subtitle">
        Password Recovery
    </div>

    <div class="reset-icon">
        🔐
    </div>

    <h2>
        Forgot Password?
    </h2>

    <p class="reset-description">
        Enter the email address associated with your
        account and we'll send you a password reset link.
    </p>


    <form method="POST">

        {% csrf_token %}

        <label for="id_email">
            📧 Registered Email Address
        </label>

        {{ form.email }}

        <button
            type="submit"
            class="reset-button"
        >
            📩 Send Reset Link
        </button>

    </form>


    <div class="back-login">

        <a href="{% url 'login' %}">
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
